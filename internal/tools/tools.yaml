# Every downloader release from v1.1.0 on fetches this file from the main branch, so each change
# must keep working with those releases. The fields are described in README.md ("Adding Tools").
#
# "kind: file" marks a data file such as an ISO image. Such an entry must not set "simple_tag":
# releases that predate "kind" ignore it and look for the tag "{version}-{os}_{arch}", which is
# never published for a file, so they stop with "not found" instead of loading it into memory.

kubermatic-virtualization:
  description: "Kubermatic Virtualization installer"
  registry: "quay.io/kubermatic/kubermatic-virtualization-installer"
  binary_name: "kubermatic-virtualization"
  tags:
    - latest
    - v1.3.0
    - v1.2.1
    - v1.1.0
  architectures:
    - amd64
  os:
    - linux
  simple_tag: true

conformance-tester:
  description: "Kubermatic conformance cli"
  registry: "quay.io/kubermatic/conformance-ee"
  binary_name: "conformance-tester"
  tags:
    - latest-cli
    - v0.1.1-cli
    - v0.1.0-cli
    - v2.30.0-beta.1-cli
  architectures:
    - amd64
    - arm64
  os:
    - linux
    - darwin
    - windows
